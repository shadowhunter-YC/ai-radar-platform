services:
  # 主服务：AI 情报雷达平台 (Next.js 15 + Node.js 22)
  ai-radar:
    image: ai-radar-platform:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-radar-platform
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3100}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-AI情报雷达平台}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V4-Pro}
      - COLLECTION_DATA_DIR=/app/data
      - DATABASE_URL=${DATABASE_URL:-}
      - WECHAT_RSS_BASE_URL=${WECHAT_RSS_BASE_URL:-http://192.168.1.107:8001}
      - WECHAT_RSS_PUBLIC_URL=${WECHAT_RSS_PUBLIC_URL:-https://wewe.wilsongo.top}
      - WECHAT_RSS_ADMIN_USER=${WECHAT_RSS_ADMIN_USER:-admin}
      - WECHAT_RSS_ADMIN_PASS=${WECHAT_RSS_ADMIN_PASS:-admin@123}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # RSSHub 服务：X (Twitter) 等全网信源转换器
  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
      - PROXY_URI=http://192.168.1.107:20171
      - TWITTER_AUTH_TOKEN=${TWITTER_AUTH_TOKEN:-f6310610b338f09bd8f17cf30ee21513209eb3e0}

  # 可选服务：PostgreSQL 数据库（完整模式下启用）
  # 启动命令：docker compose --profile postgres up -d
  postgres:
    image: postgres:16-alpine
    container_name: ai-radar-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_radar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
